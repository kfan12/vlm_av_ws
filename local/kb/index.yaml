# Node index for vlm_av_ws. Fields source/publishes/subscribes/parameters are
# generated by tools/avkit/kb_index.py --update (do not edit); package,
# description, setups, plans, notes, reports, invariants are hand-written.
# --check fails when the generated fields lag the code or a listed file is missing.
nodes:
