    description: 'lidar adaptive cruise: nearest in-lane cluster ahead, alpha-beta gap tracker, time-gap speed limit as a
      VelocityConstraint'
    source: src/av_features_cpp/src/acc_node.cpp
    publishes:
    - /feature/acc/constraint VelocityConstraint
    - /feature/acc/debug_markers visualization_msgs/MarkerArray
