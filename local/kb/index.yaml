    package: scripts
    description: event-driven demo pane watchers (AEB state, arbiter source, ACC state)
    source: scripts/_course_demo_watch.py
    publishes: []
    subscribes:
    - /cmd_vel Twist
    - /control/active_source String
    - /feature/acc/state Float64MultiArray
    - /maneuver/target_speed Float64
    - /planning/binding_constraint String
    - /safety/aeb_status AebStatus
