n_maneuver_node.py", "l": 512}, {"fn": "SignLabelLatch.on_label", "t": "Accept a VLM label only if it was captured while the board was in the readable distance band, then lock it.", "f": "src/vlm_planner_py/vlm_planner_py/sign_latch.py", "l": 79}, {"fn": "ManeuverStateMachine.on_sign", "t": "Arm the maneuver while the board is ahead and commit it when the board is passed.", "f": "src/vlm_planner_py/vlm_planner_py/maneuver.py", "l": 95}, {"fn": "ManeuverStateMachine.on_path", "t": "Release a turn back to straight once the lane centre line has stopped turning.", "f": "src/vlm_planner_py/vlm_planner_py/maneuver.py", "l": 124}, {"fn": "SignManeuverNode._tick", "t": "Publish the target speed and maneuver state, plus the debug image.", "f": "src/vlm_planner_py/vlm_planner_py/sign_maneuver_node.py", "l": 328}]}, "lead_vehicle": {"pkg": "tools/avkit", "files": ["tools/avkit/lead_vehicle.py", "tools/avkit/aeb_obstacle.py"], "role": "Scenario tool: spawns a box truck in the right lane, drives it along the lane with pure pursuit at a time-speed profile, and removes it.", "setups": "acc scenarios (run_acc_scenario.sh)", "trigger": "Command line: spawn, drive or remove.", "flow": [{"fn": "spawn", "t": "Place the truck at arc length s on the right-lane centre, facing along the road.", "f": "tools/avkit/lead_vehicle.py", "l": 116}, {"fn": "drive", "t": "Follow the right-lane centre line with pure pursuit, speed from the profile, publishing /lead/cmd_vel.", "f": "tools/avkit/lead_vehicle.py", "l": 160}, {"fn": "remove", "t": "Delete the model and wait until it is gone.", "f": "tools/avkit/lead_vehicle.py", "l": 134}]}, "mpc_closed_loop_sim": {"pkg": "av_behavior_cpp", "files": ["src/av_behavior_cpp/src/mpc/mpc_closed_loop_sim.cpp", "src/av_behavior_cpp/src/mpc/mpc_solver.cpp", "src/av_behavior_cpp/src/mpc/vehicle_model.cpp", "src/av_behavior_cpp/src/mpc/path_utils.cpp"], "role": "Offline closed-loop test of the real MPC solver against a plant with the measured steering lag and the  "comment"}, {"k": "struct", "n": "ChainPt", "l": 53, "e": 57, "s": "struct ChainPt", "d": "", "h": "none"}, {"k": "fn", "n": "grid_dedup", "l": 60, "e": 96, "s": "Chain grid_dedup(const Chain &pts, double cell_m)", "d": "Merge points that fall in the same grid cell into their mean, keeping the yellow flag, so dense near-field pixels do not dominate clustering.", "h": "explained"}, {"k": "struct", "n": "StopLineHit", "l": 98, "e": 102, "s": "struct StopLineHit", "d": "", "h": "none"}, {"k": "fn", "n": "detect_and_strip_stop_line", "l": 104, "e": 145, "s": "StopLineHit detect_and_strip_stop_line(Chain &gridded, double x_max_m)", "d": "Look for a wide band of white points across the lane in 0.5 m forward bins; if found, report its distance and remove those points so they do not become a lane edge.", "h": "explained"}, {"k": "fn", "n": "cluster_chains", "l": 146, "e": 201, "s": "std::vector<Chain> cluster_chains(Chain pts, double link_gap_m)", "d": "Grow chains of points by nearest neighbour, starting from the point closest to the car, linking while the next point is within link_gap_m.", "h": "explained"}, {"k": "fn", "n": "merge_collinear", "l": 203, "e": 260, "s": "void merge_collinear(std::vector<Chain> &chains, double gap_white_m, double gap_yellow_m, double angle_max_rad)", "d": "Join chain pieces that continue each other (small end-to-start gap, similar direction); yellow dashes get a larger gap budget than white lines.", "h": "explained"}, {"k": "fn", "n": "drop_stray_chains", "l": 262, "e": 282, "s": "void drop_stray_chains(std::vector<Chain> &chains, int min_pts, double min_extent_m)", "d": "Drop chains with too few points or too short an extent; if every chain fails, keep the longest one rather than publish nothing.", "h": "explained"}, {"k": "fn", "n": "resample_chain_x", "l": 284, "e": 324, "s": "Chain resample_chain_x(Chain c, double slice_m)", "d": "Sort a chain by forward distance and average it into fixed forward slices.", "h": "explained"}, {"k": "struct", "n": "OffsetChain", "l": 326, "e": 329, "s": "struct OffsetChain", "d": "", "h": "none"}, {"k": "struct", "n": "MarkingStats", "l": 336, "e": 341, "s": "struct MarkingStats", "d": "Forward-bin occupancy STRUCTURE of a lane boundary, for /lane/markings. Counting occupied bins alone can't tell \"solid, only 13 m detected\" from \"dashed\" -- both land near half. What separates them is the GAP pattern: a solid line never leaves a multi-bin hole; the 3 m-paint / 4.5 m-gap dash cycle always does.", "h": "comment"}, {"k": "fn", "n": "marking_stats", "l": 343, "e": 378, "s": "MarkingStats marking_stats(const std::vector<Chain> &chains, double d_max_m, double bin_m)", "d": "Count which forward bins a boundary occupies and its longest gap, for the solid or dashed classification.", "h": "explained"}, {"k": "fn", "n": "marking_type", "l": 384, "e": 393, "s": "std::string marking_type(const MarkingStats &s)", "d": "solid: a long contiguous run, at most a detection-dropout hole. dashed: a >=2 m empty run somewhere in the span (a solid line never has one; the centre dash cycle always does). none: too little to tell -- a lone dash or a stub reads \"none\" until the car moves and more comes into view.", "h": "comment"}, {"k": "struct", "n": "ClassifyResult", "l": 395, "e": 400, "s": "struct ClassifyResult", "d": "", "h": "none"}, {"k": "fn", "n": "classify_and_offset", "l": 402, "e": 469, "s": "ClassifyResult classify_and_offset(const std::vector<Chain> &chains, double lane_half_m, double lane_mem_y, bool have_lane_mem, double occ_d_max_m, double occ_bin_m)", "d": "Pick the yellow centre line and the white right edge, drop white chains on the far side of yellow, and offset each by half a lane toward the right-lane centre (lane memory decides when only one line is seen).", "h": "explained"}, {"k": "fn", "n": "xbin_merge", "l": 472, "e": 489, "s": "av::geom::Polyline xbin_merge(const std::vector<OffsetChain> &offsets, double bin_m)", "d": "x-bin merge: collapse to one centerline", "h": "comment"}, {"k": "fn", "n": "folds_back", "l": 491, "e": 505, "s": "bool folds_back(const av::geom::Polyline &c)", "d": "True if the centre line turns by more than 90 degrees between two segments, which marks a broken frame.", "h": "explained"}, {"k": "class", "n": "LaneNode", "l": 509, "e": 640, "s": "class LaneNode : public rclcpp::Node", "d": "", "h": "none"}, {"k": "struct", "n": "Params", "l": 516, "e": 549, "s": "struct Params", "d": "", "h": "none"}, {"k": "struct", "n": "ChainResult", "l": 551, "e": 559, "s": "struct ChainResult", "d": "", "h": "none"}, {"k": "struct", "n": "PoseSample", "l": 592, "e": 596, "s": "struct PoseSample", "d": "", "h": "none"}, {"k": "fn", "n": "LaneNode::LaneNode", "l": 642, "e": 766, "s": "LaneNode::LaneNode()", "d": "Declare every parameter (camera geometry, colour gates, chain tuning), derive the pinhole from the configured image size and FOV, and create the subscriptions, publishers and depth watchdog.", "h": "explained"}, {"k": "fn", "n": "LaneNode::on_rgb", "l": 768, "e": 771, "s": "void LaneNode::on_rgb(sensor_msgs::msg::Image::ConstSharedPtr msg)", "d": "Store the latest RGB frame.", "h": "explained"}, {"k": "fn", "n": "LaneNode::on_depth", "l": 773, "e": 779, "s": "void LaneNode::on_depth(sensor_msgs::msg::Image::ConstSharedPtr msg)", "d": "Store the depth frame, feed the watchdog, and run tick when an RGB frame is also available.", "h": "explained"}, {"k": "fn", "n": "LaneNode::on_camera_info", "l": 781, "e": 791, "s": "void LaneNode::on_camera_info(sensor_msgs::msg::CameraInfo::ConstSharedPtr msg)", "d": "Check once that the bridged camera intrinsics agree with the derived ones and warn if not (they are never used).", "h": "explained"}, {"k": "fn", "n": "LaneNode::on_odom", "l": 793, "e": 804, "s": "void LaneNode::on_odom(nav_msgs::msg::Odometry::ConstSharedPtr msg)", "d": "Append the pose to a 60 s history so frames can be placed at their capture time.", "h": "explained"}, {"k": "fn", "n": "LaneNode::pose_at" ing rate (reset on a jump) and of odom position and velocity; set moved after a confirmed whole-vehicle motion.", "h": "explained"}, {"k": "fn", "n": "AccNode::nearest", "l": 394, "e": 401, "s": "const Track *nearest(bool only_accepted) const", "d": "nearest track by gap, optionally only among accepted ones", "h": "comment"}, {"k": "fn", "n": "AccNode::publish", "l": 403, "e": 445, "s": "void publish(const rclcpp::Time &t, double v_ego)", "d": "Pick the nearest accepted track as lead and apply the time-gap policy; publish the cap with a reason, the 13-field state and markers.", "h": "explained"}, {"k": "fn", "n": "AccNode::publish_markers", "l": 447, "e": 484, "s": "void publish_markers(const rclcpp::Time &t, const std::string &text, const Track *lead)", "d": "RViz markers for the lead and the status text.", "h": "explained"}, {"k": "fn", "n": "main", "l": 510, "e": 516, "s": "int main(int argc, char **argv)", "d": "Spin the node.", "h": "explained"}]}, "src/av_planning_coordinator/src/trajectory_coordinator_node.cpp": {"loc": 137, "role": "trajectory_coordinator - merges every fresh VelocityConstraint into the planner's nominal speed profile and publishes the authorized path + profile the MPC tracks. Velocity only: the path passes through unchanged. Each constraint caps the whole profile at its maximum_speed_mps (pointwise minimum), so the result is never faster than the planner or any feature allows. Event-driven: one output per incoming profile. A timer re-publishing the last plan would make a dead local_planner look alive to the MPC and defeat ...", "users": ["trajectory_coordinator_node"], "items": [{"k": "class", "n": "TrajectoryCoordinator", "l": 32, "e": 129, "s": "class TrajectoryCoordinator : public rclcpp::Node", "d": "", "h": "none"}, {"k": "fn", "n": "TrajectoryCoordinator::TrajectoryCoordinator", "l": 35, "e": 61, "s": "TrajectoryCoordinator()", "d": "Read constraint_topics and required_constraint_topics (refuse a required topic that is not listed) and subscribe to each, plus the planner path and profile.", "h": "explained"}, {"k": "fn", "n": "TrajectoryCoordinator::fresh", "l": 64, "e": 67, "s": "bool fresh(const VelocityConstraint::ConstSharedPtr &c) const", "d": "A constraint is fresh until its valid_until stamp.", "h": "explained"}, {"k": "fn", "n": "TrajectoryCoordinator::on_profile", "l": 69, "e": 115, "s": "void on_profile(const std_msgs::msg::Float32MultiArray::ConstSharedPtr &profile)", "d": "Merge: cap the profile at every fresh constraint, record the binding one, hold at 0 if a required one is missing, publish the authorized plan.", "h": "explained"}, {"k": "fn", "n": "main", "l": 131, "e": 137, "s": "int main(int argc, char **argv)", "d": "Spin the node.", "h": "explained"}]}, "src/av_planning_coordinator/src/constraint_from_maneuver_node.cpp": {"loc": 87, "role": "constraint_from_maneuver - republishes the speed target on /maneuver/target_speed (+ /maneuver/state) as a VelocityConstraint, so the coordinator can merge it with other features' caps. The constraint is valid for validity_window_sec after the last target message, the same 1.0 s window mpc_tracker_v2 applies to the target itself: if the publisher stops, the constraint goes stale and a coordinator that lists it as required holds the car. Publishes nothing until the first target arrives.", "users": ["constraint_from_maneuver_node"], "items": [{"k": "class", "n": "ConstraintFromManeuver", "l": 21, "e": 79, "s": "class ConstraintFromManeuver : public rclcpp::Node", "d": "", "h": "none"}, {"k": "fn", "n": "ConstraintFromManeuver::ConstraintFromManeuver", "l": 24, "e": 46, "s": "ConstraintFromManeuver()", "d": "Declare the source name, validity window and rate, subscribe to the target speed and maneuver state, and start the timer.", "h": "explained"}, {"k": "fn", "n": "ConstraintFromManeuver::tick", "l": 49, "e": 66, "s": "void tick()", "d": "Publish the latest target speed as a priority-3 constraint valid for validity_window_sec.", "h": "explained"}, {"k": "fn", "n": "main", "l": 81, "e": 87, "s": "int main(int argc, char **argv)", "d": "Spin the node.", "h": "explained"}]}, "src/robot_bringup/src/odom_noise.cpp": {"loc": 96, "role": "odom_noise - overlay Gaussian measurement noise on wheel odometry's twist (vx, vy, wz), independent of the slip1/slip2 mechanism in sedan_description/urdf/sedan.urdf.xacro. The two are different EKF-vs-wheel-odom failure modes, not substitutes: slip1/slip2 breaks the AckermannSteering plugin's no-slip KINEMATIC ASSUMPTION itself under load, producing a systematic (non-zero-mean) yaw error that only shows up in real turns. This node instead adds honest zero-mean sensor noise on top of an otherwise-correct no-slip ...", "users": ["odom_noise"], "items": [{"k": "class", "n": "OdomNoise", "l": 34, "e": 87, "s": "class OdomNoise : public rclcpp::Node", "d": "", "h": "none"}, {"k": "fn", "n": "OdomNoise::OdomNoise", "l": 37, "e": 37, "s": "OdomNoise()", "d": "Declare topics and noise levels and set up the relay.", "h": "explained"}, {"k": "fn", "n": "OdomNoise::add_noise", "l": 63, "e": 78, "s": "nav_msgs::msg::Odometry add_noise(nav_msgs::msg::Odometry msg)", "d": "Add Gaussian noise to vx, vy and yaw rate and report the variance in the covariance.", "h": "explained"}, {"k": "fn", "n": "main", "l": 89, "e": 95, "s": "int main(int argc, char **argv)", "d": "Spin the node.", "h": "explained"}]}, "src/robot_bringup/src/odom_compare.cpp": {"loc": 148, "role": "odom_compare - shift odometry sources that are in the wrong frame into the spawn-zeroed `odom` frame the rest of the stack uses, so RViz can overlay EKF / wheel / ground-truth odometry directly. Why this node exists: the Gazebo OdometryPublisher ground-truth plugin (/odom_truth) stamps its messages `frame_id: odom` but the pose it carries is the vehicle's ABSOLUTE world pose - it starts at the map spawn point, not at the origin. The other odometry sources (/odom wheel odometry, /odom_ekf) already use the REP-105 ...", "users": ["odom_compare"], "items": [{"k": "fn", "n": "premul_rz", "l": 33, "e": 43, "s": "geometry_msgs::msg::Quaternion premul_rz(double theta, const geometry_msgs::msg::Quaternion &q)", "d": "q_out = Rz(theta) (x) q_in (Hamilton product, planar yaw rotation about +z).", "h": "comment"}, {"k": "struct", "n": "Relay", "l": 45, "e": 49, "s": "struct Relay", "d": "", "h": "none"}, {"k": "class", "n": "OdomCompare", "l": 52, "e": 139, "s": "class OdomCompare : public rclcpp::Node", "d": "", "h": "none"}, {"k": "fn", "n": "OdomCompare::OdomCompare", "l": 55, "e": 110, "s": "OdomCompare()", "d": "Read the spawn pose and frame names and create one relay per configured input.", "h": "explained"}, {"k": "fn", "n": "OdomCompare::convert", "l": 113, "e": 133, "s": "nav_msgs::msg::Odometry convert(const nav_msgs::msg::Odometry &in, bool world_frame) const", "d": "World-frame input: subtract the spawn pose and rotate into odom; relabel frame ids.", "h": "explained"}, {"k": "fn", "n": "main", "l": 141, "e": 147, "s": "int main(int argc, char **argv)", "d": "Spin the node.", "h": "explained"}]}, "src/vlm_planner_py/vlm_planner_py/vlm_sign_node.py": {"loc": 315, "role": "VLM sign node - Qwen sign reading, decoupled from the path planner. Subscribes to the front camera, classifies the nearest road sign with Qwen2.5-VL-3B in its OWN worker thread (back to back by default), and publishes the result: /vlm/sign std_msgs/String - JSON {\"sign\": <label>, \"stamp\": <capture sec>} where label is one of {right,left,winding,stop,none,unparsed} and stamp is the classified FRAME's image-header time. Inference takes ~1.5 s, so by arrival the car has moved - the stamp lets the consumer attribute ...", "users": ["vlm_sign_node"], "items": [{"k": "class", "n": "VlmSignNode", "l": 53, "e": 294, "s": "class VlmSignNode", "d": "", "h": "none"}, {"k": "fn", "n": "VlmSignNode.__init__", "l": 54, "e": 135, "s": "def __init__(self)", "d": "Declare parameters, subscribe to the camera and the sign ROI, create publishers, and start the inference thread.", "h": "explained"}, {"k": "fn", "n": "VlmSignNode._infer_loop", "l": 137, "e": 151, "s": "def _infer_loop(self)", "d": "Read signs until shutdown: one _sign_tick at a time, paced to at most vlm_query_rate_hz (wall clock) when that is > 0. Idles while there is no frame or the query is disabled (_sign_tick logs why).", "h": "comment"}, {"k": "fn", "n": "VlmSignNode.destroy_node", "l": 153, "e": 155, "s": "def destroy_node(self)", "d": "Signal the inference thread to stop, then destroy the node.", "h": "explained"}, {"k": "fn", "n": "VlmSignNode._image_cb", "l": 158, "e": 159, "s": "def _image_cb(self, msg)", "d": "Store the latest camera frame.", "h": "explained"}, {"k": "fn", "n": "VlmSignNode._roi_cb", "l": 161, "e": 167, "s": "def _roi_cb(self, msg)", "d": "Store the latest board ROI and its stamp.", "h": "explained"}, {"k": "fn", "n": "VlmSignNode._crop_for_inference", "l": 169, "e": 187, "s": "def _crop_for_inference(self, bgr, img_stamp_sec)", "d": "Return (image-for-Qwen, roi_used). Crops to the board ROI when it is fresh relative to THIS frame (both stamps are sim time), upscaling small crops; otherwise the full frame.", "h": "comment"}, {"k": "fn", "n": "VlmSignNode._query_enabled", "l": 189, "e": 191, "s": "def _query_enabled(self)", "d": "Live switch, read fresh so `ros2 param set` toggles it at runtime.", "h": "comment"}, {"k": "fn", "n": "VlmSignNode._ensure_model", "l": 193, "e": 214, "s": "def _ensure_model(self)", "d": "Load the VLM if it is not loaded yet (idempotent, thread-safe). Returns (model, processor) or None on failure. Called once from the startup preload thread and again from _sign_tick; whichever gets the lock first does the (~2-3 min) load, the other waits and reuses it.", "h": "comment"}, {"k": "fn", "n": "VlmSignNode._run_vlm", "l": 216, "e": 241, "s": "def _run_vlm(self, prompt, bgr)", "d": "Run Qwen on the given BGR image -> {'action','confidence'} or None (fail safe on unknown/low-confidence/error). Loads the model if the startup preload has not finished yet.", "h": "comment"}, {"k": "fn", "n": "VlmSignNode._sign_tick", "l": 243, "e": 282, "s": "def _sign_tick(self)", "d": "One read of the latest frame. Returns True if a read ran.", "h": "comment"}, {"k": "fn", "n": "VlmSignNode._publish_overlay", "l": 284, "e": 294, "s": "def _publish_overlay(self, bgr, action, cstr, latency, header, roi)", "d": "Draw the label (and the inference ROI, when one was used) on the frame and publish on the sign-image topic.", "h": "comment"}, {"k": "fn", "n": "main", "l": 297, "e": 311, "s": "def main(args)", "d": "Spin on a SingleThreadedExecutor while the inference runs in its own thread.", "h": "explained"}]}, "src/vlm_planner_py/vlm_planner_py/img_convert.py": {"loc": 59, "role": "cv_bridge-free sensor_msgs/Image <-> numpy converters. cv_bridge's compiled boost module crashes at runtime under NumPy 2.x (`_ARRAY_API not found` in cvtColor2), and the VLM node must run inside the torch venv (NumPy 2). These numpy-only converters keep both nodes independent of that conflict; they also work fine under system NumPy 1.x.", "users": ["vlm_sign_node", "sign_maneuver_node"], "items": [{"k": "fn", "n": "img_msg_to_bgr", "l": 12, "e": 30, "s": "def img_msg_to_bgr(msg)", "d": "Decode a sensor_msgs/Image to a BGR numpy array. Handles the common camera encodings + row padding (msg.step).", "h": "comment"}, {"k": "fn", "n": "bgr_to_img_msg", "l": 33, "e": 43, "s": "def bgr_to_img_msg(bgr, header)", "d": "Pack a BGR numpy array into a sensor_msgs/Image.", "h": "comment"}, {"k": "fn", "n": "img_msg_to_depth", "l": 46, "e": 58, "s": "def img_msg_to_depth(msg)", "d": "Decode a depth sensor_msgs/Image to a float32 (metres) numpy array. ros_gz_bridge publishes depth as 32FC1 (metres); 16UC1 (mm) as fallback.", "h": "comment"}]}, "src/vlm_planner_py/vlm_planner_py/vlm_prompts.py": {"loc": 21, "role": "The sign-classification prompt text and the valid labels.", "users": ["vlm_sign_node"], "items": []}, "src/vlm_planner_py/vlm_planner_py/json_parser.py": {"loc": 73, "role": "Parses the VLM reply into a label and confidence.", "users": ["vlm_sign_node"], "items": [{"k": "fn", "n": "parse_sign_class", "l": 7, "e": 57, "s": "def parse_sign_class(response, valid_labels)", "d": "Parse a sign-class VLM response -> {'action': label, 'confidence': float|None}. Prefer the JSON object ({\"sign\":..., \"confidence\":...}); fall back to keyword search over the raw text. Returns None on an unknown/empty/garbled answer so the caller FAILS SAFE (no invented class). 'none' is a valid label (no sign in view), returned as a dict; None means the read itself failed.", "h": "comment"}, {"k": "fn", "n": "parse_vlm_json", "l": 60, "e": 72, "s": "def parse_vlm_json(response)", "d": "Extract JSON from VLM response string.", "h": "comment"}]}, "src/vlm_planner_py/vlm_planner_py/model_runner.py": {"loc": 186, "role": "Loads Qwen2.5-VL (4-bit on the GPU when available) and runs one inference.", "users": ["vlm_sign_node"], "items": [{"k": "fn", "n": "load_vlm_model", "l": 12, "e": 44, "s": "def load_vlm_model(model_name, device, torch_dtype, do_image_splitting)", "d": "Load a generic VLM and processor (the older path; the node uses load_qwen_model).", "h": "explained"}, {"k": "fn", "n": "run_vlm_inference", "l": 46, "e": 91, "s": "def run_vlm_inference(model, processor, image_pil, prompt_text, max_new_tokens)", "d": "Run a single VLM inference. Returns the decoded response string.", "h": "comment"}, {"k": "fn", "n": "cv2_to_pil", "l": 94, "e": 98, "s": "def cv2_to_pil(bgr_img)", "d": "Convert OpenCV BGR numpy array to PIL Image.", "h": "comment"}, {"k": "fn", "n": "load_qwen_model", "l": 111, "e": 159, "s": "def load_qwen_model(model_name, device)", "d": "Lazy-load Qwen2.5-VL-3B, 4-bit nf4 on GPU (~2.5 GB on the 6 GB 3060) when bitsandbytes is available, else full precision on CPU. Cached module-globally so repeated calls are free. Logs VRAM after the first load.", "h": "comment"}, {"k": "fn", "n": "run_qwen_inference", "l": 162, "e": 185, "s": "def run_qwen_inference(model, processor, image_pil, prompt_text, max_new_tokens)", "d": "Single Qwen2.5-VL inference on an in-memory PIL image. Returns (response_str, elapsed_sec). Greedy decode for determinism.", "h": "comment"}]}, "src/vlm_planner_py/vlm_planner_py/sign_maneuver_node.py": {"loc": 588, "role": "sign_maneuver_node - v2 sign→action pipeline (course demo). The v2 port of v1's sign geometry + arbitration (vlm_node Phases 1-3+5), decoupled from any path planning: the road curvature steers the car (lane_node → local_planner → MPC); signs only shape SPEED and add a stop point - the v2 advisory invariant (caps only, never raises) holds by construction. Pipeline, all reused v1 logic where it was unit-tested: camera depth → elevated-blob board detection (z-band for full-size boards) → odom board latch + label lock ...", "users": ["sign_maneuver_node"], "items": [{"k": "fn", "n": "depth_msg_to_m", "l": 55, "e": 57, "s": "def depth_msg_to_m(msg)", "d": "sensor_msgs/Image depth → float32 metres array (row-padding aware).", "h": "comment"}, {"k": "class", "n": "SignManeuverNode", "l": 59, "e": 569, "s": "class SignManeuverNode", "d": "", "h": "none"}, {"k": "fn", "n": "SignManeuverNode.__init__", "l": 60, "e": 209, "s": "def __init__(self)", "d": "Declare parameters, build the latch and state machine, subscribe to RGB, depth, lane path, odometry and the VLM label, and start the tick timer.", "h": "explained"}, {"k": "fn", "n": "SignManeuverNode._rgb_cb", "l": 212, "e": 213, "s": "def _rgb_cb(self, m)", "d": "------------------------------------------------------------- callbacks", "h": "comment"}, {"k": "fn", "n": "SignManeuverNode._depth_cb", "l": 215, "e": 216, "s": "def _depth_cb(self, m)", "d": "Store the latest depth frame.", "h": "explained"}, {"k": "fn", "n": "SignManeuverNode._lane_cb", "l": 218, "e": 219, "s": "def _lane_cb(self, m)", "d": "Store the latest lane path.", "h": "explained"}, {"k": "fn", "n": "SignManeuverNode._odom_cb", "l": 221, "e": 225, "s": "def _odom_cb(self, m)", "d": "Store the latest pose.", "h": "explained"}, {"k": "fn", "n": "SignManeuverNode._label_cb", "l": 227, "e": 238, "s": "def _label_cb(self, m)", "d": "Offer a VLM label to the latch with its capture stamp.", "h": "explained"}, {"k": "fn", "n": "SignManeuverNode._base_to_odom", "l": 242, "e": 245, "s": "def _base_to_odom(self, bx, by)", "d": "------------------------------------------------------------- geometry", "h": "comment"}, {"k": "fn", "n": "SignManeuverNode._odom_to_base", "l": 247, "e": 251, "s": "def _odom_to_base(self, pt)", "d": "Transform an odom point into base_link.", "h": "explained"}, {"k": "fn", "n": "SignManeuverNode._sign_colored_frac", "l": 253, "e": 276, "s": "def _sign_colored_frac(self, bgr, sel_stride)", "d": "(frac, mean_bgr, mean_hsv) for the blob's ACTUAL RGB footprint. frac = fraction of the connected-component pixels (upsampled to full res, dilated one stride cell to absorb minor RGB/depth misalignment) that are sign-coloured (red octagon / yellow diamond). The two means are for diagnosing a near-zero frac: blue-ish -> channel swap; dark -> raise v_min / lower it; grey -> the footprint is off the sign.", "h": "comment"}, {"k": "fn", "n": "SignManeuverNode._detect_boards", "l": 278, "e": 325, "s": "def _detect_boards(self, depth_m, rgb_bgr)", "d": "Elevated blobs in the depth image → list of (bx, by, bbox_px, npts), bbox in FULL-RES pixel coords. Vectorized at stride resolution. When rgb_bgr is given and the colour gate is on, blobs whose RGB footprint is not mostly red/yellow are dropped (buildings, poles, foliage).", "h": "comment"}, {"k": "fn", "n": "SignManeuverNode._tick", "l": 328, "e": 431, "s": "def _tick(self)", "d": "------------------------------------------------------------- main tick", "h": "comment"}, {"k": "fn", "n": "SignManeuverNode._publish_debug_image", "l": 433, "e": 510, "s": "def _publish_debug_image(self, out, speed)", "d": "Raw camera frame + board boxes + Qwen ROI + FSM/label/speed readout.", "h": "comment"}, {"k": "fn", "n": "SignManeuverNode._update_board", "l": 512, "e": 569, "s": "def _update_board(self, boards, now, frame_t)", "d": "Track ONE board: nearest detection ahead; identity sticky within match_radius; a locked label freezes the identity (v1 label-lock).", "h": "comment"}, {"k": "fn", "n": "main", "l": 572, "e": 582, "s": "def main(args)", "d": "Spin the node.", "h": "explained"}]}, "src/vlm_planner_py/vlm_planner_py/sign_latch.py": {"loc": 107, "role": "Distance-gated latch for VLM sign labels (ROS-free, unit-tested). Problem: the Qwen label on /vlm/sign is frame-global and sticky, while the geometric board latch is per-board. Fusing \"latest label\" with \"current board distance\" fails two ways: * A read taken FAR away (unreliable - small board, past misreads) sticks around and gets armed once the board later comes within reach. * A read taken too CLOSE returns 'none' (the camera crops the board top) or, with a second sign in view, the NEXT board's symbol, and ...", "users": ["sign_maneuver_node"], "items": [{"k": "class", "n": "SignLabelLatch", "l": 38, "e": 106, "s": "class SignLabelLatch", "d": "", "h": "none"}, {"k": "fn", "n": "SignLabelLatch.__init__", "l": 39, "e": 52, "s": "def __init__(self, min_dist_m, max_dist_m, history_sec, match_tol_sec)", "d": "min/max_dist_m: readable band on the latched-board distance at the label's CAPTURE time. history_sec: how much (stamp, dist) history to keep for capture-time lookup. match_tol_sec: max |stamp difference| between the label's capture stamp and the nearest recorded frame.", "h": "comment"}, {"k": "fn", "n": "SignLabelLatch.record", "l": 54, "e": 60, "s": "def record(self, t, dist)", "d": "Record one planning frame: capture stamp t [s] and the latched board distance at that frame (None = no board latched). Call every tick, AFTER the board latch update for the frame.", "h": "comment"}, {"k": "fn", "n": "SignLabelLatch.lock", "l": 62, "e": 70, "s": "def lock(self)", "d": "Freeze the current label until the board passes behind. Called by the node once the tracked board comes within the lock distance: from here to the commit point the board escapes the camera view, so no further read - of this board's clipped remains or of the NEXT board entering the frame - may change the decision. No-op without a latched label (nothing to protect).", "h": "comment"}, {"k": "fn", "n": "SignLabelLatch.clear_board", "l": 71, "e": 77, "s": "def clear_board(self)", "d": "The latched board passed behind: next board gets a fresh identity and an empty label. Frames already recorded keep the OLD identity, so an in-flight read of the old board cannot leak onto the new one.", "h": "comment"}, {"k": "fn", "n": "SignLabelLatch.on_label", "l": 79, "e": 106, "s": "def on_label(self, label, t_capture)", "d": "Offer a VLM read. t_capture = the label's image stamp [s]; None falls back to the newest recorded frame (legacy, unstamped labels). Returns (accepted: bool, reason: str) for logging.", "h": "comment"}]}, "src/vlm_planner_py/vlm_planner_py/maneuver.py": {"loc": 155, "role": "Maneuver coordination state machine (pure Python, no ROS deps). Turns the noisy per-frame sign read into an explicit *maneuver* the car is committed to, with a clean entry (commit on the distance edge) and exit (the road is straight again). States: 'straight' (default / plain lane following), 'left', 'right', 'winding' (an active turn / winding maneuver), 'stop' (terminal halt intent). Driven by the caller each tick through two INDEPENDENT inputs: - on_sign(pending_label, commit) -- ENTRY. Arm a maneuver while its ...", "users": ["sign_maneuver_node"], "items": [{"k": "fn", "n": "path_heading_change", "l": 50, "e": 77, "s": "def path_heading_change(pts)", "d": "Total absolute heading change and arc length of a base_link (x, y) polyline. Returns (total_abs_dheading_rad, length_m). The heading change is the sum of |dheading| between c ft of travel) and arc length of q on the lane", "h": "comment"}, {"k": "fn", "n": "at_s", "l": 89, "e": 97, "s": "void at_s(const Lane &L, double s, double &x, double &y)", "d": "Point on the lane at arc length s.", "h": "explained"}, {"k": "fn", "n": "kappa_at", "l": 99, "e": 108, "s": "double kappa_at(const Lane &L, double s)", "d": "Lane curvature at arc length s.", "h": "explained"}, {"k": "fn", "n": "main", "l": 111, "e": 314, "s": "int main(int argc, char **argv)", "d": "Parse overrides, run the closed loop (plant with steering lag, solver on the visible window), and print the metrics.", "h": "explained"}]}, "src/av_safety_cpp/src/obstacle_probe.cpp": {"loc": 221, "role": "The range-probe node.", "users": ["obstacle_probe"], "items": [{"k": "struct", "n": "Nearest", "l": 20, "e": 28, "s": "struct Nearest", "d": "", "h": "none"}, {"k": "fn", "n": "nearest_in_band", "l": 30, "e": 44, "s": "Nearest nearest_in_band(const std::vector<av::safety::ObstacleCluster> &cl, double half_band, double ms)", "d": "Nearest cluster ahead within a lateral band.", "h": "explained"}, {"k": "fn", "n": "json", "l": 46, "e": 53, "s": "std::string json(const Nearest &n)", "d": "Format one result as JSON.", "h": "explained"}, {"k": "class", "n": "ObstacleProbe", "l": 56, "e": 212, "s": "class ObstacleProbe : public rclcpp::Node", "d": "", "h": "none"}, {"k": "fn", "n": "ObstacleProbe::ObstacleProbe", "l": 59, "e": 109, "s": "ObstacleProbe()", "d": "Declare extrinsics and filters, subscribe to depth and lidar, and start the sampling timer.", "h": "explained"}, {"k": "fn", "n": "ObstacleProbe::timed", "l": 112, "e": 119, "s": "template <class F> static std::pair<std::vector<av::safety::ObstacleCluster>, double> timed(F f)", "d": "Run an extractor and measure its time.", "h": "explained"}, {"k": "fn", "n": "ObstacleProbe::sample", "l": 121, "e": 151, "s": "void sample()", "d": "Run both extractors on the latest inputs and publish their nearest results.", "h": "explained"}, {"k": "fn", "n": "ObstacleProbe::publish_markers", "l": 159, "e": 193, "s": "void publish_markers(const std::vector<av::safety::ObstacleCluster> &dcl, bool depth_fresh, const std::vector<av::safety::ObstacleCluster> &lcl, bool cloud_fresh)", "d": "Each sensor's cubes carry the stamp of the image / cloud they came from: RViz then places them with the TF at measurement time, and the stamp is on the stack's (sim) clock even though this node runs on the wall clock. Stamping with now() here gave wall-clock stamps that no TF lookup can reach (\"Lookup would require extrapolation into the future\"). A stale sensor draws nothing (its cubes expire after their lifetime).", "h": "comment"}, {"k": "fn", "n": "main", "l": 214, "e": 220, "s": "int main(int argc, char **argv)", "d": "Spin the node.", "h": "explained"}]}}, "built": "2026-11-16"};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = (n) => 'node-' + n.replace(/_/g, '-');
const unslug = (h) => h.startsWith('node-') ? h.slice(5).replace(/-/g, '_') : null;
let current = 'lane_node';

// nav + picker
const nav = $('nav'), picker = $('picker');
for (const [g, names] of D.groups) {
  const sec = document.createElement('div');
  sec.innerHTML = `<h3>${esc(g)}</h3><ul>${names.map(n => `<li><button type="button" data-node="${n}">${esc(n)}</button></li>`).join('')}</ul>`;
  nav.appendChild(sec);
  const og = document.createElement('optgroup');
  og.label = g;
  for (const n of names) { const o = document.createElement('option'); o.value = n; o.textContent = n; og.appendChild(o); }
  picker.appendChild(og);
}
nav.addEventListener('click', (e) => { const b = e.target.closest('button[data-node]'); if (b) go(b.dataset.node); });
picker.addEventListener('change', () => go(picker.value));

function go(n, fnTarget) {
  current = n;
  $('q').value = '';
  try { history.replaceState(null, '', '#' + slug(n)); } catch (e) { location.hash = slug(n); }
  render(fnTarget);
}

function itemRow(f, it) {
  const lines = it.e && it.e !== it.l ? `L${it.l}-${it.e}` : `L${it.l}`;
  const doc = it.d ? `<p class="idoc">${esc(it.d)}${it.h === 'comment' ? '<span class="src">source comment</span>' : ''}</p>` : '<p class="idoc none">No description.</p>';
  return `<div class="it" id="${esc(rowId(f, it.n, it.l))}"><div class="iname">${esc(it.n)}<small>${lines}</small></div>${doc}<code class="isig">${esc(it.s)}</code></div>`;
}
const rowId = (f, n, l) => 'r-' + (f + '-' + n + '-' + l).replace(/[^A-Za-z0-9]/g, '-');

function render(fnTarget) {
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.node === current)));
  picker.value = current;
  const N = D.nodes[current];
  const flow = N.flow.map(s => `<li>${s.f ? `<button type="button" data-f="${esc(s.f)}" data-n="${esc(s.fn)}" data-l="${s.l}">${esc(s.fn)}</button>` : `<span class="nf">${esc(s.fn)}</span>`} - ${esc(s.t)}</li>`).join('');
  const filesHtml = N.files.map(f => {
    const F = D.files[f];
    const fns = F.items.filter(i => i.k === 'fn');
    const types = F.items.filter(i => i.k !== 'fn');
    const others = F.users.filter(u => u !== current);
    const typeHtml = types.length ? `<div class="types">Types: ${types.map(t => `<code title="${esc(t.d)}">${esc(t.n)}</code> <span>(L${t.l})</span>`).join(', ')}</div>` : '';
    return `<section class="file">
      <div class="fhead"><span class="fpath">${esc(f)}</span><span class="flines">${F.loc} lines, ${fns.length} functions</span></div>
      ${others.length ? `<div class="chips"><span class="flines">also in:</span>${others.map(o => `<button type="button" class="chip" data-node="${o}">${esc(o)}</button>`).join('')}</div>` : ''}
      ${F.role ? `<p class="frole">${esc(F.role)}</p>` : ''}
      ${typeHtml}
      <div class="items">${fns.map(i => itemRow(f, i)).join('') || '<p class="empty">No functions (declarations or data only).</p>'}</div>
    </section>`;
  }).join('');
  $('main').innerHTML = `
    <section class="card">
      <h2 class="node-title">${esc(current)}</h2>
      <div class="meta"><span><b>package</b> ${esc(N.pkg)}</span><span><b>setups</b> ${esc(N.setups)}</span><span><b>files</b> ${N.files.length}</span></div>
      <p class="role">${esc(N.role)}</p>
    </section>
    <section class="card">
      <h2>One cycle</h2>
      <p class="trigger"><b>Runs on:</b> ${esc(N.trigger)}</p>
      <ol class="flow">${flow}</ol>
    </section>
    <section class="card"><h2>Source files and functions</h2>${filesHtml}</section>`;
  if (fnTarget) flash(fnTarget.f, fnTarget.n, fnTarget.l); else window.scrollTo({ top: 0 });
}

function flash(f, n, l) {
  const F = D.files[f];
  const it = F && F.items.find(i => i.l === Number(l)) || F && F.items.find(i => i.n === n || i.n.endsWith('::' + n) || i.n.endsWith('.' + n));
  if (!it) return;
  const el = document.getElementById(rowId(f, it.n, it.l));
  if (!el) return;
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1600);
}

$('main').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-f]');
  if (b) { flash(b.dataset.f, b.dataset.n, b.dataset.l); return; }
  const c = e.target.closest('button[data-node]');
  if (c) { go(c.dataset.node); return; }
  const r = e.target.closest('.res .it');
  if (r) go(r.dataset.node, { f: r.dataset.f, n: r.dataset.n, l: r.dataset.l });
});

// search across every file of every node
$('q').addEventListener('input', () => {
  const q = $('q').value.trim().toLowerCase();
  if (!q) { render(); return; }
  const out = [], seen = new Set();
  for (const [node, N] of Object.entries(D.nodes)) for (const f of N.files) {
    if (seen.has(f)) continue;
    seen.add(f);
    for (const it of D.files[f].items) {
      if (it.k !== 'fn') continue;
      if ((it.n + ' ' + it.d + ' ' + f).toLowerCase().includes(q)) out.push({ node: D.files[f].users[0], f, it });
    }
  }
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', 'false'));
  $('main').innerHTML = `<section class="card"><h2>${out.length} function${out.length === 1 ? '' : 's'} matching "${esc(q)}"</h2><div class="res">${out.slice(0, 120).map(r =>
    `<div class="it" data-node="${r.node}" data-f="${esc(r.f)}" data-n="${esc(r.it.n)}" data-l="${r.it.l}"><div class="iname">${esc(r.it.n)}<small>${esc(r.f.split('/').pop())} L${r.it.l}</small></div><p class="idoc">${esc(r.it.d || 'No description.')}</p></div>`).join('') || '<p class="empty">Nothing found.</p>'}</div></section>`;
});

const total = Object.values(D.files).reduce((a, F) => a + F.items.filter(i => i.k === 'fn').length, 0);
$('foot').textContent = `${Object.keys(D.nodes).length} nodes, ${Object.keys(D.files).length} source files, ${total} functions. Built ${D.built} from the code; line numbers drift as it changes.`;
function fromHash() { const n = unslug((location.hash || '').slice(1)); if (n && D.nodes[n]) current = n; }
window.addEventListener('hashchange', () => { fromHash(); render(); });
fromHash();
render();
</script>
