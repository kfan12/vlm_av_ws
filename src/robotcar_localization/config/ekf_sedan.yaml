# V2 sedan EKF (day 06) — NEW file, v1 ekf.yaml untouched.
# Same fusion structure as v1 (wheel twist + IMU yaw/yaw-rate/ax); process
# noise left at robot_localization defaults for the first implementation —
# retune on the day-06 drift plot when the sim runs (target < 2 %/distance).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    #              x      y      z      roll   pitch  yaw    vx     vy     vz     vr     vp     vyaw   ax     ay     az
    odom0_config: [false, false, false, false, false, false, true,  true,  false, false, false, false, false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu
    #             x      y      z      roll   pitch  yaw    vx     vy     vz     vr     vp     vyaw   ax     ay     az
    imu0_config: [false, false, false, false, false, true,  false, false, false, false, false, true,  true,  false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true